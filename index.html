<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#285fbb"><meta name="description" content="領収書・計算機・写真報告書をひとつに。無料・広告なし・登録不要。">
<link rel="manifest" href="./manifest.webmanifest"><title>便利ツール | 仕事に役立つ3つの道具</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif;background:#f4f7fb;color:#19314d;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;padding:0 16px 110px}.wrap{max-width:720px;margin:0 auto}.hero{padding:42px 4px 20px}
.kicker{font-size:12px;font-weight:800;letter-spacing:.12em;color:#376cb2}.hero h1{font-size:30px;letter-spacing:-.04em;margin:12px 0 9px}.hero p{font-size:14px;color:#63758b;line-height:1.8;margin:0}
.grid{display:grid;gap:12px;margin:16px 0}.tool{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #dce5ef;border-radius:20px;padding:19px;text-decoration:none;color:inherit;box-shadow:0 3px 12px #172c4508}.tool:active{background:#edf4fd}.ic{display:grid;place-items:center;flex:0 0 55px;height:55px;background:#eaf1fc;border-radius:16px;font-size:27px;color:#285fbb}
.tool strong{font-size:17px;display:block}.tool small{font-size:12px;color:#68798b;line-height:1.7;display:block;margin-top:5px}.arrow{margin-left:auto;color:#6a7c8f;font-size:21px}
.settings{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;background:#fff;border:1px solid #dce5ef;border-radius:16px;text-decoration:none;color:#2e527a;font-weight:700;font-size:14px}
.note{font-size:12px;line-height:1.8;color:#607387;margin:22px 2px}.note strong{color:#354f70}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}.tool:last-child{grid-column:span 2}.hero{padding-top:68px}}@media(max-width:380px){.tool{padding:15px}.ic{flex-basis:48px;height:48px}.hero h1{font-size:26px}}
</style>
</head>
<body><main class="wrap">
<header class="hero"><div class="kicker">FREE WORK TOOLS</div><h1>仕事の便利ツール</h1><p>領収書作成、計算、写真報告まで。<br>必要な道具をひとつのアプリから使えます。</p></header>
<section class="grid" aria-label="ツール一覧">
<a class="tool" href="./receipt/"><span class="ic" aria-hidden="true">▤</span><span><strong>領収書を作る</strong><small>宛名・角印・インボイス・PDF保存</small></span><span class="arrow" aria-hidden="true">›</span></a>
<a class="tool" href="./merchant-calculator/"><span class="ic" aria-hidden="true">¥</span><span><strong>手取りを計算する</strong><small>手数料・逆算・口コミ率・評価管理</small></span><span class="arrow" aria-hidden="true">›</span></a>
<a class="tool" href="./before-after-tsukurukun/"><span class="ic" aria-hidden="true">▣</span><span><strong>写真報告書を作る</strong><small>BEFORE・AFTER、単体写真、A4 PDF</small></span><span class="arrow" aria-hidden="true">›</span></a>
</section>
<a class="settings" href="./settings/"><span>⚙ 設定・バックアップ</span><span aria-hidden="true">›</span></a>
<p class="note"><strong>無料・広告なし・登録不要。</strong>入力内容や写真は原則として端末内で処理します。保存データは端末やブラウザーごとに分かれます。大切な記録は設定からバックアップしてください。</p>
</main><script src="./shared/shell.js"></script></body></html>
